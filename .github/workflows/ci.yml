name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # @playwright/test 是 devDep,只在本地 npm run e2e 用。CI 不跑 e2e,
  # 阻止 postinstall 下载 chromium 二进制(~150MB)节省 npm ci 时长。
  # 本地开发首次需 `npx playwright install chromium`(README 已注明)。
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities
        run: bin/brakeman --no-pager

      - name: Lint Ruby for consistent style
        run: bin/rubocop -f github

  test_ruby:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      AMAP_API_KEY: test-dummy-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run Ruby test suite
        run: bundle exec rspec

  test_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit JS dependencies
        run: npm audit --audit-level=high

      - name: Run JS test suite
        run: npm test

  # ServiceWorkersController#show 用 2 条 gsub 改 prod build 出的 sw.js
  # 内部相对路径(scope=/ 提升后必须改),vite-plugin-pwa 升级如果改了
  # bundle 输出格式 → gsub 静默不命中 → SW 注册成功但 cache 永远空,
  # 没任何报错信号。这个 job 在 CI build 后 grep 2 个 pattern,任一
  # 不命中就 fail。详见 scripts/verify-sw-rewrite-patterns.sh 头注释。
  verify_pwa_sw_patterns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite assets (generates public/vite/sw.js)
        run: npx vite build

      - name: Verify SW rewrite patterns intact
        run: bash scripts/verify-sw-rewrite-patterns.sh
